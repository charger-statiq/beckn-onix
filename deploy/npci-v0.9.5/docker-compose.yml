# Statiq BPP ONIX on NPCI's prebuilt image -- same services, image and mounts as
# bhim/ubc-ev-sandbox/onix-adaptor/docker-compose-onix-bpp-plugin.yml (commit f705bf2),
# with our rendered config mounted instead of theirs.
#
# onix-config-init renders that config on every `up`: it reads the two private keys from
# AWS Secrets Manager and runs render-config.sh, so rotating the secret needs only
#   docker compose up -d --force-recreate onix-config-init onix-bpp-plugin
# The host needs AWS access to the secret: an instance role, or keys in a .env file here.

services:
  onix-config-init:
    # Pinned: the script relies on bash + jq being in the image.
    image: amazon/aws-cli:2.36.49
    container_name: onix-config-init
    entrypoint: ["/bin/bash", "/work/fetch-and-render.sh"]
    working_dir: /work
    volumes:
      - ./:/work
    environment:
      - AWS_REGION=${AWS_REGION:-ap-south-1}
      - ONIX_SECRET_ID=${ONIX_SECRET_ID:-dev/beckn-onix}
      # Optional: only when the host has no instance role. Read from .env (gitignored).
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN:-}
      # render-config.sh knobs, all optional
      - REDIS_ADDR=${REDIS_ADDR:-redis-onix-bpp:6379}
      - REDIS_USE_TLS=${REDIS_USE_TLS:-false}
      - HUB_OCPI_BECKN_URL=${HUB_OCPI_BECKN_URL:-https://dev.roaming.evlinq.in/beckn}
      - CDS_PUBLISH_BASE_URL=${CDS_PUBLISH_BASE_URL:-http://uat-cds.ubc.nbsl.org.in}
    restart: "no"

  redis-onix-bpp:
    image: redis:alpine
    container_name: redis-onix-bpp
    command: redis-server --requirepass UsZEXSDkj6gKyx1R
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "UsZEXSDkj6gKyx1R", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  onix-bpp-plugin:
    image: manendrapalsingh/onix-adapter:v0.9.5
    container_name: onix-bpp-plugin
    ports:
      - "8002:8002"
    volumes:
      - ./.rendered:/app/config
    environment:
      - CONFIG_FILE=/app/config/adapter.yaml
      - REDIS_PASSWORD=UsZEXSDkj6gKyx1R
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector-bpp:4317
    # The image has no curl/wget/nc, so the probe uses bash's /dev/tcp.
    # Without this a crash loop still shows as "Up" in `docker compose ps`.
    healthcheck:
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8002 && printf "GET /health HTTP/1.0\r\n\r\n" >&3 && grep -q "\"status\":\"ok\"" <&3']
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 45s
    restart: unless-stopped
    depends_on:
      onix-config-init:
        condition: service_completed_successfully
      redis-onix-bpp:
        condition: service_healthy
      otel-collector-bpp:
        condition: service_started

  otel-collector-bpp:
    # Pinned: `latest` can change the OTTL syntax otel-config.yml relies on.
    image: otel/opentelemetry-collector-contrib:0.161.0
    container_name: otel-collector-bpp
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-config.yml:/etc/otelcol/config.yaml:ro
    restart: unless-stopped
