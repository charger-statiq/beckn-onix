# Statiq BPP ONIX on NPCI's prebuilt image -- same services, image and mounts as
# bhim/ubc-ev-sandbox/onix-adaptor/docker-compose-onix-bpp-plugin.yml (commit f705bf2),
# with our rendered config mounted instead of theirs. Run ./render-config.sh first.
version: '3.8'

services:
  redis-onix-bpp:
    image: redis:alpine
    container_name: redis-onix-bpp
    command: redis-server --requirepass your-redis-password
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "your-redis-password", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  onix-bpp-plugin:
    image: manendrapalsingh/onix-adapter:v0.9.5
    container_name: onix-bpp-plugin
    ports:
      - "8002:8002"
    volumes:
      - ./.rendered:/app/config
    environment:
      - CONFIG_FILE=/app/config/adapter.yaml
      - REDIS_PASSWORD=your-redis-password
      - OTEL_EXPORTER_OTLP_INSECURE=true
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector-bpp:4317
    restart: unless-stopped
    depends_on:
      redis-onix-bpp:
        condition: service_healthy
      otel-collector-bpp:
        condition: service_started

  otel-collector-bpp:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector-bpp
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-config.yml:/etc/otelcol/config.yaml:ro
    restart: unless-stopped
