# Redis for ONIX's mandatory cache plugin. Service name matches the default addr in adapter.yaml (redis-onix-bpp:6379).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-onix-bpp
  namespace: statiq-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-onix-bpp
  template:
    metadata:
      labels:
        app: redis-onix-bpp
    spec:
      containers:
        - name: redis
          image: redis:alpine
          args: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)"]
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: onix-redis
                  key: password
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-onix-bpp
  namespace: statiq-dev
spec:
  selector:
    app: redis-onix-bpp
  ports:
    - port: 6379
      targetPort: 6379
