# Same service name and NodePort as today (the dev ALB for beckn-onix-dev.evlinq.in targets 30087);
# only the container port moves from 8080 to 8002.
apiVersion: v1
kind: Service
metadata:
  name: onix
  namespace: statiq-dev
spec:
  type: NodePort
  selector:
    app: onix
  ports:
    - name: http
      port: 8080
      targetPort: 8002
      nodePort: 30087
