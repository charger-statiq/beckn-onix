appName: "onix"
log:
  level: debug
  destinations:
    - type: stdout
  contextKeys:
    - transaction_id
    - message_id
    - subscriber_id
    - module_id
http:
  port: 8080
  timeout:
    read: 30
    write: 30
    idle: 30
pluginManager:
  root: /app/plugins
modules:
  - name: bapTxnReciever
    path: /bap/reciever/
    handler:
      type: std
      role: bap
      httpClientConfig:
        maxIdleConns: 1000
        maxIdleConnsPerHost: 200
        idleConnTimeout: 300s
        responseHeaderTimeout: 5s
      plugins:
        registry:
          id: registry
          config:
            url: http://localhost:8080/reg
            retry_max: 3
            retry_wait_min: 100ms
            retry_wait_max: 500ms
        keyManager:
          id: simplekeymanager
          config:
        schemaValidator:
          id: schemavalidator
          config:
            schemaDir: /app/config/onix/schemas
        checkPolicy:
          id: opapolicychecker
          config:
            networkPolicyConfig: /app/config/onix/opa-network-policies.yaml
            refreshInterval: "5m"
        signValidator:
          id: signvalidator
        signer:
          id: signer
        router:
          id: router
          config:
            routingConfig: /app/config/onix/bapTxnReciever-routing.yaml
        middleware:
          - id: reqpreprocessor
            config:
              contextKeys: transaction_id,message_id
              role: bap
      steps:
        - validateSign
        - checkPolicy
        - addRoute
        - validateSchema
        - signAck
  - name: bapTxnCaller
    path: /bap/caller/
    handler:
      type: std
      role: bap
      httpClientConfig:
        maxIdleConns: 1000
        maxIdleConnsPerHost: 200
        idleConnTimeout: 300s
        responseHeaderTimeout: 5s
      plugins:
        registry:
          id: registry
          config:
            url: http://localhost:8080/reg
            retry_max: 3
            retry_wait_min: 100ms
            retry_wait_max: 500ms
        keyManager:
          id: simplekeymanager
          config:
        schemaValidator:
          id: schemavalidator
          config:
            schemaDir: /app/config/onix/schemas
        checkPolicy:
          id: opapolicychecker
          config:
            networkPolicyConfig: /app/config/onix/opa-network-policies.yaml
            refreshInterval: "5m"
        signer:
          id: signer
        signValidator:
          id: signvalidator
        router:
          id: router
          config:
            routingConfig: /app/config/onix/bapTxnCaller-routing.yaml
        middleware:
          - id: reqpreprocessor
            config:
              contextKeys: transaction_id,message_id
              role: bap
      steps:
        - validateSchema
        - checkPolicy
        - addRoute
        - sign
        - validateAckSign
  - name: bppTxnReciever
