appName: "bpp-ev-charging"

plugins:
  otelsetup:
    id: otelsetup
    config:
      serviceName: "onix-adapter-bpp-dev"
      serviceVersion: "1.0.0"
      environment: "dev"
      domain: "ev_charging"
      otlpEndpoint: "localhost:4317"
      enableMetrics: "false"
      networkMetricsGranularity: "2min"
      networkMetricsFrequency: "4min"
      enableTracing: "false"
      enableLogs: "false"
      timeInterval: "5"
      auditFieldsConfig: "/app/config/audit-fields.yaml"

log:
  level: info
  destinations:
    - type: stdout
  contextKeys:
    - transaction_id
    - message_id
    - subscriber_id
    - module_id
    - parent_id

http:
  port: 8080
  timeout:
    read: 30
    write: 30
    idle: 30

pluginManager:
  root: /app/plugins

modules:
  - name: bppTxnReceiver
    path: /bpp/receiver/
    handler:
      type: std
      role: bpp
      subscriberId: cert-statiq.evlinq.in
      httpClientConfig:
        maxIdleConns: 1000
        maxIdleConnsPerHost: 200
        idleConnTimeout: 300s
        responseHeaderTimeout: 5s
      plugins:
        registry:
          id: dediregistry
          config:
            url: https://fabric.nfh.global/registry/dedi
            registryName: subscribers.beckn.one
            allowedNetworkIDs: ubc.nbsl.org.in/NBSL_UAT_Reference_Registry
            retry_max: 3
            retry_wait_min: 100ms
            retry_wait_max: 500ms
        keyManager:
          id: simplekeymanager
          config:
            subscriberId: cert-statiq.evlinq.in
            keyId: "76EU8qiBwfUBmq3RN18KXQt5DsqEumw2hbFK4RuqpaKfvdb2RiQnnX"
            signingPrivateKey: "${ONIX_SIGNING_PRIVATE_KEY}"
            signingPublicKey: "9qfP5CbO7qbrIiGpyCMse2uk7F/LAgrFrQw8AESupWM="
            encrPrivateKey: "${ONIX_ENCR_PRIVATE_KEY}"
            encrPublicKey: "fnS4p9rcIoJ9d62ia4ZKKfm7TIa9BuVF6XVgcDZdVmE="
        # Core v2 schema from GitHub; UBC blocks validated via their @context URLs (bhim/ubc-tsd).
        schemaValidator:
          id: schemav2validator
          config:
            type: url
            location: https://raw.githubusercontent.com/beckn/protocol-specifications-v2/refs/heads/core-v2.0.0-rc/api/beckn.yaml
            cacheTTL: "3600"
            extendedSchema_enabled: "true"
            extendedSchema_cacheTTL: "3600"
            extendedSchema_maxCacheSize: "100"
            extendedSchema_downloadTimeout: "30"
            extendedSchema_allowedDomains: "raw.githubusercontent.com"
        signValidator:
          id: signvalidator
        router:
          id: router
          config:
            routingConfig: /app/config/onix/bppTxnReciever-routing.yaml
        middleware:
          - id: reqpreprocessor
            config:
              contextKeys: transaction_id,message_id,parent_id
              role: bpp
      steps:
        - validateSign
        - addRoute
        - validateSchema

  - name: bppTxnCaller
    path: /bpp/caller/
    handler:
      type: std
      role: bpp
      subscriberId: cert-statiq.evlinq.in
      httpClientConfig:
        maxIdleConns: 1000
        maxIdleConnsPerHost: 200
        idleConnTimeout: 300s
        responseHeaderTimeout: 5s
      plugins:
        registry:
          id: dediregistry
          config:
            url: https://fabric.nfh.global/registry/dedi
            registryName: subscribers.beckn.one
            allowedNetworkIDs: ubc.nbsl.org.in/NBSL_UAT_Reference_Registry
            retry_max: 3
            retry_wait_min: 100ms
            retry_wait_max: 500ms
        keyManager:
          id: simplekeymanager
          config:
            subscriberId: cert-statiq.evlinq.in
            keyId: "76EU8qiBwfUBmq3RN18KXQt5DsqEumw2hbFK4RuqpaKfvdb2RiQnnX"
            signingPrivateKey: "${ONIX_SIGNING_PRIVATE_KEY}"
            signingPublicKey: "9qfP5CbO7qbrIiGpyCMse2uk7F/LAgrFrQw8AESupWM="
            encrPrivateKey: "${ONIX_ENCR_PRIVATE_KEY}"
            encrPublicKey: "fnS4p9rcIoJ9d62ia4ZKKfm7TIa9BuVF6XVgcDZdVmE="
        # Core v2 schema from GitHub; UBC blocks validated via their @context URLs (bhim/ubc-tsd).
        schemaValidator:
          id: schemav2validator
          config:
            type: url
            location: https://raw.githubusercontent.com/beckn/protocol-specifications-v2/refs/heads/core-v2.0.0-rc/api/beckn.yaml
            cacheTTL: "3600"
            extendedSchema_enabled: "true"
            extendedSchema_cacheTTL: "3600"
            extendedSchema_maxCacheSize: "100"
            extendedSchema_downloadTimeout: "30"
            extendedSchema_allowedDomains: "raw.githubusercontent.com"
        signer:
          id: signer
        router:
          id: router
          config:
            routingConfig: /app/config/onix/bppTxnCaller-routing.yaml
        middleware:
          - id: reqpreprocessor
            config:
              contextKeys: transaction_id,message_id,parent_id
              role: bpp
      steps:
        - validateSchema
        - addRoute
        - sign
