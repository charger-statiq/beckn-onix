# BPP Caller routing -- OUTBOUND: Hub-OCPI -> ONIX -> BHIM / NBSL's CDS
#
# Hub-OCPI POSTs to {BECKN_ONIX_CLIENT_URL}/{on_action}; ONIX signs the message
# and decides the second hop from the rules below.
#
# `targetType: bap` means "read context.bap_uri from the body and send it there"
# -- so every on_* reply goes back to whichever BAP opened the transaction.
#
# 🛑 catalog_publish is NOT a reply to a BAP. It is our catalogue being pushed to
#    NBSL's CDS, so it needs its own `url` rule. The CDS endpoint has not been
#    supplied by NBSL yet (Q3) -- the rule is left commented out rather than
#    pointing somewhere wrong. Uncomment and fill in the url when it arrives,
#    and set BECKN_CDS_PUBLISH_URL on the Hub-OCPI side in the same change.
#
# NOTE on `domain`: ONIX normalizes the domain to a wildcard for any v2.x rule
# (router.go: isV2Version -> domain "*") and prints a warning if one is set, so
# at version 2.0.0 routing keys on VERSION + ACTION only. The domain is therefore
# omitted below deliberately -- it would be ignored and would log a warning on
# every boot. Our domain is beckn.one:deg:ev-charging.

routingRules:
  - version: "2.0.0"
    targetType: "bap"
    endpoints:
      - on_select
      - on_init
      - on_confirm
      - on_update
      - on_track
      - on_status

